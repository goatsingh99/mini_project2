<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Tic Tac Toe</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Cosmic Background and Base Styles */
        body {
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Floating Particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(20px);
                opacity: 0;
            }
        }

        /* Game Container with Glow Effect */
        .game-container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            padding: 30px;
            border-radius: 15px;
            background-color: rgba(10, 10, 20, 0.7);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 30px rgba(100, 150, 255, 0.3);
            position: relative;
            z-index: 1;
        }

        h1 {
            margin-bottom: 20px;
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.8);
        }

        .status {
            margin-bottom: 25px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 5px rgba(100, 200, 255, 0.5);
        }

        /* Game Board with Neon Effect */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 10px;
            margin-bottom: 25px;
            background-color: rgba(20, 30, 50, 0.5);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(100, 150, 255, 0.2);
            box-shadow: 0 0 20px rgba(100, 150, 255, 0.1);
        }

        .cell {
            width: 100%;
            height: 100px;
            background-color: rgba(15, 25, 40, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            aspect-ratio: 1/1;
            border-radius: 5px;
            border: 1px solid rgba(100, 150, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .cell:hover {
            background-color: rgba(30, 50, 80, 0.7);
            box-shadow: 0 0 15px rgba(100, 200, 255, 0.3);
            transform: scale(1.03);
        }

        .cell::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .cell:hover::before {
            opacity: 1;
        }

        .cell.x {
            color: #4fc3f7;
            text-shadow: 0 0 10px rgba(79, 195, 247, 0.7);
        }

        .cell.o {
            color: #ff5252;
            text-shadow: 0 0 10px rgba(255, 82, 82, 0.7);
        }

        /* Reset Button with Glow */
        .reset-btn {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            background-color: rgba(30, 50, 80, 0.7);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(100, 150, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .reset-btn:hover {
            background-color: rgba(50, 80, 120, 0.7);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.3);
            transform: translateY(-2px);
        }

        .reset-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .reset-btn:hover::after {
            opacity: 1;
        }

        /* Winning Cells Effect */
        .winning-cell {
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
            50% { box-shadow: 0 0 30px rgba(255, 255, 255, 0.7); }
            100% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .game-container {
                max-width: 320px;
                padding: 20px;
            }
            
            .cell {
                height: 80px;
                font-size: 3rem;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Game Container -->
    <div class="game-container">
        <h1>Cosmic Tic Tac Toe</h1>
        <div class="status">Your turn (X)</div>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        <button class="reset-btn">Reset Game</button>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random position
                const posX = Math.random() * 100;
                const posY = Math.random() * 100 + 100; // Start below viewport
                
                // Random size and animation duration
                const size = Math.random() * 3 + 1;
                const duration = Math.random() * 20 + 10;
                const delay = Math.random() * 10;
                
                particle.style.left = `${posX}%`;
                particle.style.top = `${posY}%`;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                
                particlesContainer.appendChild(particle);
            }
        }

        // Initialize game
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            
            const board = document.getElementById('board');
            const cells = document.querySelectorAll('.cell');
            const status = document.querySelector('.status');
            const resetBtn = document.querySelector('.reset-btn');
            
            let gameActive = true;
            let currentPlayer = 'X'; // Human is X, Computer is O
            let gameState = ['', '', '', '', '', '', '', '', ''];
            
            const winningConditions = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
                [0, 4, 8], [2, 4, 6]             // diagonals
            ];
            
            // Handle cell click
            function handleCellClick(e) {
                const clickedCell = e.target;
                const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));
                
                // If cell already played or game not active, ignore
                if (gameState[clickedCellIndex] !== '' || !gameActive) return;
                
                // Make human move
                makeMove(clickedCell, clickedCellIndex, currentPlayer);
                
                // Check if human won
                if (checkWin()) {
                    status.textContent = 'You won! 🌟';
                    gameActive = false;
                    return;
                }
                
                // Check for draw
                if (checkDraw()) {
                    status.textContent = 'Cosmic stalemate! ✨';
                    gameActive = false;
                    return;
                }
                
                // Switch to computer's turn
                currentPlayer = 'O';
                status.textContent = "Computer's turn (O)";
                status.style.textShadow = "0 0 5px rgba(255, 82, 82, 0.5)";
                
                // Computer makes move after a short delay
                setTimeout(computerMove, 800);
            }
            
            // Make a move on the board
            function makeMove(cell, index, player) {
                gameState[index] = player;
                cell.classList.add(player.toLowerCase());
                cell.textContent = player;
                
                // Update status glow
                status.style.textShadow = player === 'X' 
                    ? "0 0 5px rgba(79, 195, 247, 0.5)" 
                    : "0 0 5px rgba(255, 82, 82, 0.5)";
            }
            
            // Computer's move logic
            function computerMove() {
                if (!gameActive) return;
                
                // Simple AI: first try to win, then block, then random move
                let move = findWinningMove('O') || findWinningMove('X') || findRandomMove();
                
                if (move !== null) {
                    makeMove(cells[move], move, 'O');
                    
                    // Check if computer won
                    if (checkWin()) {
                        status.textContent = 'Computer won! ☄️';
                        highlightWinningCells();
                        gameActive = false;
                        return;
                    }
                    
                    // Check for draw
                    if (checkDraw()) {
                        status.textContent = 'Cosmic stalemate! ✨';
                        gameActive = false;
                        return;
                    }
                    
                    // Switch back to human's turn
                    currentPlayer = 'X';
                    status.textContent = 'Your turn (X)';
                    status.style.textShadow = "0 0 5px rgba(79, 195, 247, 0.5)";
                }
            }
            
            // Check for winning move (for either player)
            function findWinningMove(player) {
                for (let condition of winningConditions) {
                    const [a, b, c] = condition;
                    
                    // Check if two in a row and third is empty
                    if (gameState[a] === player && gameState[b] === player && gameState[c] === '') {
                        return c;
                    }
                    if (gameState[a] === player && gameState[c] === player && gameState[b] === '') {
                        return b;
                    }
                    if (gameState[b] === player && gameState[c] === player && gameState[a] === '') {
                        return a;
                    }
                }
                return null;
            }
            
            // Find a random empty cell
            function findRandomMove() {
                const emptyCells = gameState.reduce((acc, cell, index) => {
                    if (cell === '') acc.push(index);
                    return acc;
                }, []);
                
                return emptyCells.length > 0 ? emptyCells[Math.floor(Math.random() * emptyCells.length)] : null;
            }
            
            // Check for win
            function checkWin() {
                for (let condition of winningConditions) {
                    const [a, b, c] = condition;
                    
                    if (gameState[a] !== '' && 
                        gameState[a] === gameState[b] && 
                        gameState[a] === gameState[c]) {
                        
                        highlightWinningCells(condition);
                        return true;
                    }
                }
                return false;
            }
            
            // Highlight winning cells
            function highlightWinningCells(winningCombo) {
                if (!winningCombo) return;
                
                winningCombo.forEach(index => {
                    cells[index].classList.add('winning-cell');
                });
            }
            
            // Check for draw
            function checkDraw() {
                return !gameState.includes('');
            }
            
            // Reset game
            function resetGame() {
                gameActive = true;
                currentPlayer = 'X';
                gameState = ['', '', '', '', '', '', '', '', ''];
                status.textContent = 'Your turn (X)';
                status.style.textShadow = "0 0 5px rgba(79, 195, 247, 0.5)";
                
                cells.forEach(cell => {
                    cell.classList.remove('x', 'o', 'winning-cell');
                    cell.textContent = '';
                });
            }
            
            // Event listeners
            cells.forEach(cell => {
                cell.addEventListener('click', handleCellClick);
            });
            
            resetBtn.addEventListener('click', resetGame);
        });
    </script>
</body>
</html>
